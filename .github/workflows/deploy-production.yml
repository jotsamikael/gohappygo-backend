# Display name for this workflow in the GitHub Actions tab
name: Deploy Production

# Manual promote only — no auto-deploy on push to main
on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  VPS_APP_DIR: htdocs/backend.gohappygo.fr
  PM2_APP_NAME: gohappygo-api-prod
  APP_PORT: '3008'
  RELEASES_TO_KEEP: 5
  HEALTH_CHECK_URL: http://127.0.0.1:3008/api/airports?limit=1
  HEALTH_CHECK_INTERVAL_SEC: 5
  HEALTH_CHECK_MAX_WAIT_SEC: 90

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Build backend and admin (production)
        run: npm run complete-build:production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist
            admin/dist
            package.json
            package-lock.json
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync release files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          REMOTE_RELEASE="${VPS_APP_DIR}/releases/${RELEASE_ID}"
          ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "mkdir -p '${REMOTE_RELEASE}/dist' '${REMOTE_RELEASE}/admin/dist'"
          rsync -az --delete \
            -e "ssh -p ${VPS_PORT}" \
            dist/ "${VPS_USER}@${VPS_HOST}:${REMOTE_RELEASE}/dist/"
          rsync -az --delete \
            -e "ssh -p ${VPS_PORT}" \
            admin/dist/ "${VPS_USER}@${VPS_HOST}:${REMOTE_RELEASE}/admin/dist/"
          scp -P "$VPS_PORT" package.json package-lock.json \
            "${VPS_USER}@${VPS_HOST}:${REMOTE_RELEASE}/"

      - name: Activate release, restart PM2, and verify health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" \
            "APP_DIR='${VPS_APP_DIR}' RELEASE_ID='${RELEASE_ID}' RELEASES_TO_KEEP='${RELEASES_TO_KEEP}' PM2_APP_NAME='${PM2_APP_NAME}' APP_PORT='${APP_PORT}' HEALTH_CHECK_URL='${HEALTH_CHECK_URL}' HEALTH_CHECK_INTERVAL_SEC='${HEALTH_CHECK_INTERVAL_SEC}' HEALTH_CHECK_MAX_WAIT_SEC='${HEALTH_CHECK_MAX_WAIT_SEC}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          load_node() {
            if [ -s "${HOME}/.nvm/nvm.sh" ]; then
              # shellcheck source=/dev/null
              . "${HOME}/.nvm/nvm.sh"
            fi
            if [ -d "${HOME}/.fnm" ]; then
              export PATH="${HOME}/.fnm:${PATH}"
              eval "$("${HOME}/.fnm/fnm" env)"
            fi
            if ! command -v npm >/dev/null 2>&1 && [ -s "${HOME}/.bashrc" ]; then
              # shellcheck source=/dev/null
              . "${HOME}/.bashrc"
            fi
            if ! command -v npm >/dev/null 2>&1 && [ -s "${HOME}/.profile" ]; then
              # shellcheck source=/dev/null
              . "${HOME}/.profile"
            fi
          }
          load_node
          for cmd in npm pm2; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "$cmd not found in PATH. Install Node.js on the VPS or ensure it is available in non-interactive shells."
              exit 1
            fi
          done

          APP_DIR="${HOME}/${APP_DIR}"
          RELEASE_DIR="${APP_DIR}/releases/${RELEASE_ID}"
          SHARED_DIR="${APP_DIR}/shared"
          CURRENT_LINK="${APP_DIR}/current"
          ECOSYSTEM_FILE="${SHARED_DIR}/ecosystem.config.js"

          PREVIOUS_RELEASE=""
          if [ -L "${CURRENT_LINK}" ]; then
            PREVIOUS_RELEASE="$(readlink -f "${CURRENT_LINK}")"
          fi

          if [ ! -f "${ECOSYSTEM_FILE}" ]; then
            echo "Missing ${ECOSYSTEM_FILE}. Create shared/ecosystem.config.js on the VPS."
            exit 1
          fi
          if [ ! -f "${SHARED_DIR}/.env.production" ]; then
            echo "Missing ${SHARED_DIR}/.env.production on the VPS."
            exit 1
          fi

          cd "${RELEASE_DIR}"
          npm ci --omit=dev

          resolve_nest_entry() {
            local release_dir="$1"
            local candidate
            for candidate in dist/src/main.js dist/main.js; do
              if [ -f "${release_dir}/${candidate}" ]; then
                echo "${candidate}"
                return 0
              fi
            done
            return 1
          }

          write_ecosystem_file() {
            local release_dir="$1"
            local entry="$2"
            printf '%s\n' \
              'module.exports = {' \
              '  apps: [{' \
              "    name: '${PM2_APP_NAME}'," \
              "    script: '${entry}'," \
              "    cwd: '${APP_DIR}/current'," \
              "    exec_mode: 'fork'," \
              '    instances: 1,' \
              '    autorestart: true,' \
              '    watch: false,' \
              "    max_memory_restart: '1G'," \
              '    env: {' \
              "      NODE_ENV: 'production'," \
              "      PORT: ${APP_PORT}," \
              '    },' \
              '  }],' \
              '};' \
              > "${ECOSYSTEM_FILE}"
          }

          activate_release() {
            local release_dir="$1"
            local entry="$2"
            ln -sfn "${release_dir}" "${CURRENT_LINK}"
            ln -sfn "${SHARED_DIR}/.env.production" "${CURRENT_LINK}/.env.production"
            write_ecosystem_file "${release_dir}" "${entry}"
            if pm2 describe "${PM2_APP_NAME}" >/dev/null 2>&1; then
              pm2 delete "${PM2_APP_NAME}" 2>/dev/null || true
            fi
            pm2 start "${ECOSYSTEM_FILE}" --update-env
            pm2 save
          }

          NEST_ENTRY="$(resolve_nest_entry "${RELEASE_DIR}")" || {
            echo "ERROR: Nest entry point not found under ${RELEASE_DIR}/dist"
            find "${RELEASE_DIR}/dist" -name 'main.js' 2>/dev/null || true
            exit 1
          }
          echo "Using Nest entry point: ${NEST_ENTRY}"

          if pm2 describe "${PM2_APP_NAME}" >/dev/null 2>&1; then
            pm2 stop "${PM2_APP_NAME}" 2>/dev/null || true
          fi

          ln -sfn "${SHARED_DIR}/.env.production" "${RELEASE_DIR}/.env.production"
          echo "=== Boot smoke test (direct node, before PM2) ==="
          SMOKE_LOG="${RELEASE_DIR}/.boot-smoke.log"
          cd "${RELEASE_DIR}"
          NODE_ENV=production node "${NEST_ENTRY}" > "${SMOKE_LOG}" 2>&1 &
          SMOKE_PID=$!
          smoke_ok=false
          smoke_elapsed=0
          while [ "${smoke_elapsed}" -lt "${HEALTH_CHECK_MAX_WAIT_SEC}" ]; do
            if curl -sf "${HEALTH_CHECK_URL}" -o /dev/null; then
              smoke_ok=true
              echo "Boot smoke test passed after ${smoke_elapsed}s."
              break
            fi
            if ! kill -0 "${SMOKE_PID}" 2>/dev/null; then
              echo "Boot smoke test: node process exited before API became ready."
              break
            fi
            sleep "${HEALTH_CHECK_INTERVAL_SEC}"
            smoke_elapsed=$((smoke_elapsed + HEALTH_CHECK_INTERVAL_SEC))
          done
          kill "${SMOKE_PID}" 2>/dev/null || true
          wait "${SMOKE_PID}" 2>/dev/null || true
          sleep 2

          if [ "${smoke_ok}" = false ]; then
            echo "Boot smoke test failed. Last 80 lines:"
            tail -80 "${SMOKE_LOG}" 2>/dev/null || true
            if [ -n "${PREVIOUS_RELEASE}" ] && [ -d "${PREVIOUS_RELEASE}" ]; then
              echo "Restoring previous release after failed smoke test: ${PREVIOUS_RELEASE}"
              PREVIOUS_ENTRY="$(resolve_nest_entry "${PREVIOUS_RELEASE}")" || PREVIOUS_ENTRY="dist/main.js"
              activate_release "${PREVIOUS_RELEASE}" "${PREVIOUS_ENTRY}"
            fi
            exit 1
          fi

          activate_release "${RELEASE_DIR}" "${NEST_ENTRY}"

          health_ok=false
          elapsed=0
          while [ "${elapsed}" -lt "${HEALTH_CHECK_MAX_WAIT_SEC}" ]; do
            if curl -sf "${HEALTH_CHECK_URL}" -o /dev/null; then
              health_ok=true
              echo "Health check passed after ${elapsed}s."
              break
            fi
            sleep "${HEALTH_CHECK_INTERVAL_SEC}"
            elapsed=$((elapsed + HEALTH_CHECK_INTERVAL_SEC))
            echo "Waiting for API... (${elapsed}s / ${HEALTH_CHECK_MAX_WAIT_SEC}s)"
          done

          if [ "${health_ok}" = false ]; then
            echo "Health check failed after deploy (timeout ${HEALTH_CHECK_MAX_WAIT_SEC}s)."
            echo "=== PM2 status ==="
            pm2 describe "${PM2_APP_NAME}" 2>/dev/null || true
            echo "=== PM2 logs (last 50 lines) ==="
            pm2 logs "${PM2_APP_NAME}" --lines 50 --nostream 2>/dev/null || true
            echo "=== curl debug ==="
            curl -v "${HEALTH_CHECK_URL}" 2>&1 || true
            echo "=== Release dist layout ==="
            find "${RELEASE_DIR}/dist" -name 'main.js' 2>/dev/null || true

            if [ -n "${PREVIOUS_RELEASE}" ] && [ -d "${PREVIOUS_RELEASE}" ]; then
              echo "Rolling back to ${PREVIOUS_RELEASE}"
              PREVIOUS_ENTRY="$(resolve_nest_entry "${PREVIOUS_RELEASE}")" || PREVIOUS_ENTRY="dist/main.js"
              activate_release "${PREVIOUS_RELEASE}" "${PREVIOUS_ENTRY}"
            fi
            exit 1
          fi

          echo "Deploy successful: ${RELEASE_ID}"

          if [ -d "${APP_DIR}/releases" ]; then
            cd "${APP_DIR}/releases"
            ls -1dt */ 2>/dev/null | tail -n +$((RELEASES_TO_KEEP + 1)) | xargs -r rm -rf
          fi
          REMOTE_SCRIPT
